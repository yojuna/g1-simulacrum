# Multi-container setup: MuJoCo sim + GEAR-SONIC deploy
#
# Usage:
#   docker compose up --build
#
# The sim container runs the MuJoCo physics loop and publishes robot state.
# The sonic container runs the ONNX policy inference at 50Hz.
# They communicate over DDS via a shared network.

services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: g1-simulacrum
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - MUJOCO_GL=egl           # Use EGL for headless GPU rendering
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ../configs:/app/configs:ro
    network_mode: host           # DDS needs shared network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      python -m g1_simulacrum.run
      --config /app/configs/sonic_v1_1.yaml
      --headless

  sonic:
    image: nvcr.io/nvidia/isaac/gr00t-wbc:latest
    container_name: g1-sonic
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - sonic-checkpoints:/checkpoints
    command: >
      ./deploy.sh
      --cp /checkpoints/policy/sonic_v1_1/model
      --obs-config /checkpoints/policy/sonic_v1_1/observation_config.yaml
      sim

volumes:
  sonic-checkpoints:
    driver: local
