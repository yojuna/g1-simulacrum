[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "g1-simulacrum"
version = "0.1.0"
description = "Sensorized Unitree G1 in MuJoCo: 29-DoF body, Dex3, Mid-360, D435i, 500 Hz PD"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "yojuna", email = "datamongeraami@gmail.com" }]
keywords = ["mujoco", "unitree", "g1", "lidar", "robotics", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "mujoco>=3.2",
    "mujoco-lidar>=0.3",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
# GPU LiDAR backends
taichi = ["mujoco-lidar[taichi]"]
jax = ["mujoco-lidar[jax]"]
warp = ["mujoco-lidar[warp]"]
gpu-all = ["mujoco-lidar[taichi,jax,warp]"]

gym = ["gymnasium>=0.29"]

dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

all = [
    "g1-simulacrum[gpu-all,gym]",
]

[project.scripts]
g1-simulacrum = "g1_simulacrum.cli:main"

[project.urls]
Repository = "https://github.com/yojuna/g1-simulacrum"

[tool.hatch.build.targets.wheel]
packages = ["g1_simulacrum"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
