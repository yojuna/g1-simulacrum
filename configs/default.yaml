# g1-simulacrum default configuration (ARCHITECTURE.md).
# Mount poses live in pinned MJCF, not here.

robot:
  model: g1_sensorized
  hands: dex3                   # dex3 | none
  spawn_pos: [0.0, 0.0, 0.82]
  spawn_quat: [1.0, 0.0, 0.0, 0.0]

sensors:
  mid360:
    enabled: true
    backend: cpu
    rate_hz: 10.0
    # Livox datasheet 1σ start (≤2 cm @ 10 m). Dropout/clutter are placeholders.
    noise:
      range_sigma: 0.02
      dropout_rate: 0.02
      near_field_clutter_rate: 0.01
      near_field_max_range: 0.3
    site_name: mid360
    bodyexclude: torso_link

  d435i:
    enabled: true
    rate_hz: 30.0
    resolution: [640, 480]
    # Useful stereo range ~0.3–3 m (wiki). Not a flat 0.105–10 m quality band.
    noise:
      edge_erosion: true
      depth_noise_sigma: 0.005
      hole_rate: 0.01
      min_range: 0.3
      max_range: 3.0

  imu:
    pelvis: { enabled: true, rate_hz: 500 }   # LowState
    torso:  { enabled: true, rate_hz: 500 }   # rt/secondary_imu
    mid360: { enabled: true, rate_hz: 200 }   # device IMU
    d435i:  { enabled: true, rate_hz: 200 }   # gyro; accel may be slower

controller:
  type: pd                      # pd | passthrough
  physics_hz: 1000
  control_hz: 500               # SDK2 G1 low-level (2 ms)

render: true
seed: 42
